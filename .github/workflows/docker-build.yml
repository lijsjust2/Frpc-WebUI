name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.0.0）'
        required: true
        default: 'latest'
        type: string
      frp_version:
        description: 'frp 版本号（留空自动获取最新，如 v0.61.1）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get FRP version
        id: frp
        run: |
          if [ -n "${{ inputs.frp_version }}" ]; then
            FRP_VERSION="${{ inputs.frp_version }}"
          else
            FRP_VERSION=$(curl -sL https://api.github.com/repos/fatedier/frp/releases/latest | jq -r '.tag_name')
          fi
          if [ -z "$FRP_VERSION" ] || [ "$FRP_VERSION" = "null" ]; then
            echo "ERROR: Failed to determine frp version"
            exit 1
          fi
          echo "version=$FRP_VERSION" >> $GITHUB_OUTPUT
          echo "Using frp version: $FRP_VERSION"

      - name: Determine release version
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Build AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          no-cache: true
          build-args: |
            FRP_VERSION=${{ steps.frp.outputs.version }}
          tags: frpc-webui:amd64
          outputs: type=docker,dest=/tmp/frpc-webui-amd64.tar

      - name: Build ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: false
          no-cache: true
          build-args: |
            FRP_VERSION=${{ steps.frp.outputs.version }}
          tags: frpc-webui:arm64
          outputs: type=docker,dest=/tmp/frpc-webui-arm64.tar

      - name: Compress images
        run: |
          gzip -9 /tmp/frpc-webui-amd64.tar
          gzip -9 /tmp/frpc-webui-arm64.tar
          echo "=== Image sizes ==="
          ls -lh /tmp/frpc-webui-*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "v${{ steps.rel.outputs.version }}"
          body: |
            ## Frpc WebUI v${{ steps.rel.outputs.version }}

            内置 frpc 版本: ${{ steps.frp.outputs.version }}

            ### 支持架构
            - **AMD64** (x86_64) - 适用于普通 PC、服务器、云主机
            - **ARM64** (aarch64) - 适用于树莓派、ARM 服务器

            ### 快速部署

            ```bash
            # 1. 下载对应架构的镜像（以 AMD64 为例）
            # 2. 加载镜像
            docker load -i frpc-webui-amd64.tar.gz

            # 3. 运行
            docker run -d \
              --name frpc-webui \
              --network host \
              -v ./data:/app/data \
              -e WEB_PORT=7500 \
              -e TZ=Asia/Shanghai \
              --restart unless-stopped \
              frpc-webui:amd64

            # 4. 访问 http://<IP>:7500
            ```

            ### ARM64 设备
            ```bash
            docker load -i frpc-webui-arm64.tar.gz
            docker run -d \
              --name frpc-webui \
              --network host \
              -v ./data:/app/data \
              -e WEB_PORT=7500 \
              -e TZ=Asia/Shanghai \
              --restart unless-stopped \
              frpc-webui:arm64
            ```
          draft: false
          prerelease: false
          files: |
            /tmp/frpc-webui-amd64.tar.gz
            /tmp/frpc-webui-arm64.tar.gz
