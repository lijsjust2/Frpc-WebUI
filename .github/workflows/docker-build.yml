name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.0.0）'
        required: true
        default: 'latest'
        type: string
      frp_version:
        description: 'frp 版本号（留空自动获取最新，如 v0.61.1）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# 环境变量 - 修改这里为你的 Docker Hub 用户名
env:
  DOCKERHUB_USERNAME: lijsfun

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get FRP version
        id: frp
        run: |
          if [ -n "${{ inputs.frp_version }}" ]; then
            FRP_VERSION="${{ inputs.frp_version }}"
          else
            FRP_VERSION=$(curl -sL https://api.github.com/repos/fatedier/frp/releases/latest | jq -r '.tag_name')
          fi
          if [ -z "$FRP_VERSION" ] || [ "$FRP_VERSION" = "null" ]; then
            echo "ERROR: Failed to determine frp version"
            exit 1
          fi
          echo "version=$FRP_VERSION" >> $GITHUB_OUTPUT
          echo "Using frp version: $FRP_VERSION"

      - name: Determine release version
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            FRP_VERSION=${{ steps.frp.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:amd64
            ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:${{ steps.rel.outputs.version }}-amd64

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          no-cache: true
          build-args: |
            FRP_VERSION=${{ steps.frp.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:arm64
            ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:${{ steps.rel.outputs.version }}-arm64

      - name: Create and push multi-arch manifest
        run: |
          # 创建 manifest list，合并多架构镜像
          docker buildx imagetools create -t ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:${{ steps.rel.outputs.version }} \
            ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:amd64 \
            ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:arm64
          
          # 如果是 latest 版本，也创建 latest tag
          if [ "${{ steps.rel.outputs.version }}" = "latest" ]; then
            docker buildx imagetools create -t ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:latest \
              ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:amd64 \
              ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:arm64
          fi
          
          echo "=== Pushed images ==="
          docker buildx imagetools inspect ${{ env.DOCKERHUB_USERNAME }}/frpc-webui:${{ steps.rel.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "v${{ steps.rel.outputs.version }}"
          body: |
            ## Frpc WebUI v${{ steps.rel.outputs.version }}

            内置 frpc 版本: ${{ steps.frp.outputs.version }}

            ### Docker Hub 镜像

            镜像已推送到 Docker Hub: `lijsfun/frpc-webui`

            ```bash
            docker pull lijsfun/frpc-webui:${{ steps.rel.outputs.version }}
            ```

            ### 支持架构
            - **AMD64** (x86_64) - 适用于普通 PC、服务器、云主机
            - **ARM64** (aarch64) - 适用于树莓派、ARM 服务器

            ### 快速部署

            ```bash
            # 拉取镜像（自动选择架构）
            docker pull lijsjust2/frpc-webui:${{ steps.rel.outputs.version }}

            # 运行容器
            docker run -d \
              --name frpc-webui \
              --network host \
              -v ./data:/app/data \
              -e WEB_PORT=7500 \
              -e TZ=Asia/Shanghai \
              --restart unless-stopped \
              lijsfun/frpc-webui:${{ steps.rel.outputs.version }}

            # 访问 http://<IP>:7500
            ```

            ### 使用 latest 标签

            ```bash
            docker pull lijsfun/frpc-webui:latest
            docker run -d \
              --name frpc-webui \
              --network host \
              -v ./data:/app/data \
              -e WEB_PORT=7500 \
              -e TZ=Asia/Shanghai \
              --restart unless-stopped \
              lijsfun/frpc-webui:latest
            ```
          draft: false
          prerelease: false
